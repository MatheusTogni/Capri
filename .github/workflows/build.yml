name: Gerar APK da Capri

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Baixar modelo de voz em português (Vosk)
        run: |
          curl -fL -o model.zip https://alphacephei.com/vosk/models/vosk-model-small-pt-0.3.zip
          unzip -q model.zip -d model_tmp
          mkdir -p app/src/main/assets/model
          cp -r model_tmp/*/* app/src/main/assets/model/
          ls app/src/main/assets/model

      - name: Compilar APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Publicar na página de Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk capri.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest capri.apk \
            --title "Capri (build #${{ github.run_number }})" \
            --notes "APK gerado automaticamente. Baixe o capri.apk pelo celular e instale."
